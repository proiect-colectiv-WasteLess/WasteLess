spring:
  application:
    name: WasteLess
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  storage-mode: ${STORAGE_MODE:local}
  s3:
    bucket: ${S3_BUCKET:}
    public-url: ${S3_PUBLIC_URL:}
    region: ${AWS_REGION:eu-central-1}
    endpoint: ${S3_ENDPOINT:}
  jwt-secret: ${JWT_SECRET}
  cors-origins: ${CORS_ORIGINS:}
  storage-path: ${STORAGE_PATH:./data/media}
  payment-mode: ${PAYMENT_MODE:stub}
