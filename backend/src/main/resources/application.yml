spring:
  application:
    name: WasteLess
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  jwt-secret: ${JWT_SECRET}
  cors-origins: ${CORS_ORIGINS:}
  storage-path: ${STORAGE_PATH:./data/media}
  payment-mode: ${PAYMENT_MODE:stub}
