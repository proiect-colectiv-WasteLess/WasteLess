spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    placeholders:
      demoSeedEnabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wasteless}
    username: ${DB_USER:wasteless}
    password: ${DB_PASSWORD:local-only-change-me}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
app:
  payment-mode: ${PAYMENT_MODE:mock}
  jwt-secret: ${JWT_SECRET:development-placeholder-never-use-in-production}
