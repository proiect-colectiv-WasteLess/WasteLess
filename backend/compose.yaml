services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wasteless
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d wasteless"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data: